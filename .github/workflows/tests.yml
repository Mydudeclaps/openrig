name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d3da20b48a280c15411b532179517bccb4cd9cda
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - name: F4 failing-before discriminator and address preservation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/self-attach-address.test.ts test/tmux-shell-command-identity.test.ts test/reconcile-session.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm --workspace @openrig/cli test -- test/attach.test.ts test/attach-reply-address.test.ts test/whoami.test.ts test/whoami-bounded-peers.test.ts test/whoami-host-hint.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
          cli=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ncli=%s\n' "$result" "$cli" > proof/exits.txt
          test "$result" -eq 0 && test "$cli" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-r5-red
          path: proof/
          if-no-files-found: error
