name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attach-name-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Capture the fake-tmux display-name regression on unchanged source
        run: |
          mkdir evidence
          set +e
          npm run test -w packages/cli -- test/attach.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/cli-red.json" > evidence/cli-red.log 2>&1
          code=$?
          printf '%s\n' "$code" > evidence/cli-red.exit
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-name-evidence
          path: evidence/
