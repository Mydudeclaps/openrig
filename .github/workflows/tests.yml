name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  s22-terminal-attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e98fd2b04ea1e3c19a4dea976e89b1350081ae06
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - name: Terminal current-request delivery regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/draft-aware-delivery.test.ts test/qa-draft-caller-cancel.test.ts test/send-caller-cancel.test.ts test/qa-send-caller-cancel.test.ts test/seat-delivery-guard.test.ts test/seat-delivery-guard-correction.test.ts test/typing-guard-modes.test.ts test/watchdog-delivery-guarded.test.ts test/draft-aware-delivery-native.test.ts test/compaction-draft-aware.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s22-terminal-attempts-green
          path: proof/
          if-no-files-found: error
