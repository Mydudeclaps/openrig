name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  projection-warning-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b380cd46faf8bbd4ea1a4194a6cf8ce220fde68f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prior wording must fail the supported-remedies assertion
        run: |
          git checkout bcb0438b6785f7d97a171947fa1ab9d05db90e00 -- packages/daemon/src/domain/projection-planner.ts
          set +e
          npx vitest run packages/daemon/test/projection-protect.test.ts -t 'operator_conflict warning names supported remedies' --reporter=json --outputFile=/tmp/projection-warning-red.json
          result=$?
          set -e
          test "$result" = 1
          node -e 'const r=require("/tmp/projection-warning-red.json"); const f=r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==="failed"); if(r.numFailedTests!==1 || r.numPassedTests!==0 || f.length!==1 || !f[0].title.includes("operator_conflict warning names supported remedies"))process.exit(1); console.log("Exactly the unsupported-remedy warning assertion fails on prior source.")'
          git checkout b380cd46faf8bbd4ea1a4194a6cf8ce220fde68f -- packages/daemon/src/domain/projection-planner.ts
      - name: Supported wording and unchanged projection protection
        run: npx vitest run packages/daemon/test/projection-protect.test.ts packages/daemon/test/projection-planner.test.ts packages/daemon/test/projection-manifest-wiring.test.ts packages/daemon/test/conflict-detector.test.ts packages/daemon/test/conflict-detector-discrimination.test.ts
