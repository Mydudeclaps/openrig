name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  handover-scrollback-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 80f74f608636ca9289602a2664fb31037370df21
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind current main and unchanged product
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue1544"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue1544/checkout.txt"
          git diff --exit-code
          git show "$GITHUB_SHA:packages/daemon/test/issue1544-handover-readiness.test.ts" > packages/daemon/test/issue1544-handover-readiness.test.ts
          sha256sum packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/native-resume-probe.ts packages/daemon/src/domain/seat-handover-service.ts packages/daemon/src/domain/successor-session-launcher.ts packages/daemon/src/domain/pane-cutover.ts packages/daemon/test/issue1544-handover-readiness.test.ts > "$RUNNER_TEMP/issue1544/bindings.before.txt"
      - name: Observe actual fresh handover and readiness chronology
        run: |
          set -euo pipefail
          set +e
          CHECKPOINT_OUTPUT="$RUNNER_TEMP/issue1544" npm exec -w packages/daemon -- vitest run test/issue1544-handover-readiness.test.ts --reporter verbose > "$RUNNER_TEMP/issue1544/test.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/issue1544/test.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/issue1544/test-exit.txt"
          test "$code" -eq 0
          git diff --exit-code -- packages/daemon/src
          sha256sum packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/native-resume-probe.ts packages/daemon/src/domain/seat-handover-service.ts packages/daemon/src/domain/successor-session-launcher.ts packages/daemon/src/domain/pane-cutover.ts packages/daemon/test/issue1544-handover-readiness.test.ts > "$RUNNER_TEMP/issue1544/bindings.after.txt"
          diff -u "$RUNNER_TEMP/issue1544/bindings.before.txt" "$RUNNER_TEMP/issue1544/bindings.after.txt"
          python3 - <<'PYCHECK'
          import os,json
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'issue1544'
          rows=json.loads((p/'observations.json').read_text())
          assert len(rows)==7
          for r in rows:
            assert r['result']['ok']
            assert any(x['kind']=='read' and x['reader']=='40-line-input' for x in r['trace'])
            assert any(x['kind']=='read' and x['reader']=='current-screen-input' for x in r['trace'])
          (p/'assessment.json').write_text(json.dumps({'sevenCases':7,'productPatch':'NONE','nativeExecution':'NOT RUN','inputLogging':'actual returned bytes tagged by reader'},indent=2)+'\n')
          PYCHECK
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: handover-scrollback-diagnosis
          path: ${{ runner.temp }}/issue1544/
          if-no-files-found: error
