name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  human-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 494faf60acba8137ed54d346af582eaafd1436fd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Human notice stuck-sweep regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/queue-stuck-sweep.test.ts -t '#1679 park' --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 1679-human-notice-complete
          path: proof/
          if-no-files-found: error
