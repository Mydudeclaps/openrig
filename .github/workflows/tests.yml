name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  s22-watchdog-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15dd3fd6a02f405d69aee3e4d056022f17219ef3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Watchdog delivery behavior regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/watchdog-delivery-guarded.test.ts test/watchdog-park-reminder-digest.test.ts test/watchdog-policy-engine.test.ts test/watchdog-scheduler.test.ts test/watchdog-target-gen-wiring.test.ts test/seat-delivery-guard.test.ts test/draft-aware-delivery.test.ts test/typing-guard-modes.test.ts test/parked-owner-compaction.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s22-watchdog-delivery-green-final
          path: proof/
          if-no-files-found: error
