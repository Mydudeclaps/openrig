name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  recorded-wake-runtime-red:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b9b7f372d749287fd116659aa2bb8467eea3fc69
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reproduce the recorded-session compatibility failure
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/recorded-wake"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/recorded-wake/checkout.txt"
          sha256sum packages/daemon/src/startup.ts packages/daemon/src/domain/wake-resolve-service.ts packages/daemon/src/domain/wake-resolver.ts packages/daemon/test/wake-resolve-recorded-runtime.test.ts > "$RUNNER_TEMP/recorded-wake/bindings.txt"
          set +e
          npm exec -w packages/daemon -- vitest run test/wake-resolve-recorded-runtime.test.ts --reporter=json --outputFile="$RUNNER_TEMP/recorded-wake/red.json"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/recorded-wake/red.exit"
          test "$code" -ne 0
          python3 - "$RUNNER_TEMP/recorded-wake/red.json" <<'PYTHON'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['numFailedTests']==3 and d['numPassedTests']==8, d
          failures=[a for f in d['testResults'] for a in f['assertionResults'] if a['status']=='failed']
          assert len(failures)==3 and all('AssertionError' in '\n'.join(a['failureMessages']) for a in failures)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recorded-wake-runtime-red
          path: ${{ runner.temp }}/recorded-wake/
          if-no-files-found: error
