name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  slack-timing-r2-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0925b04c45d1f64c4b9cdb325cf64e79d3ea28eb
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Selected timing and unknown-receipt assertions before correction
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/slack-answer-after-question.test.ts --reporter=verbose 2>&1 | tee proof/red.log
          result=${PIPESTATUS[0]}
          echo "$result" > proof/test-exit.txt
          git diff --exit-code > proof/source-unchanged.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-timing-r2-red
          path: proof/
          if-no-files-found: error
