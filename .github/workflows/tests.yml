name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  doctor-r2-wording:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure the two new assertions against prior wording
        run: |
          mkdir -p "$RUNNER_TEMP/doctor-r2"
          cp packages/cli/src/commands/doctor.ts "$RUNNER_TEMP/doctor-r2/candidate-doctor.ts"
          git show caddbfd75990f5b26ca961cb4fbcc967ba83c9e6:packages/cli/src/commands/doctor.ts > packages/cli/src/commands/doctor.ts
          set +e
          npx vitest run packages/cli/test/doctor.test.ts -t 'control unavailable \(default\)|check.s limited read' --reporter=json --outputFile="$RUNNER_TEMP/doctor-r2/prior.json" > "$RUNNER_TEMP/doctor-r2/prior.log" 2>&1
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'PYCODE'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'doctor-r2/prior.json').read_text())
          assert x['numFailedTests']==2 and x['numPassedTests']==0,x
          print('Two intended prior-wording assertion failures recorded')
          PYCODE
      - name: Verify candidate doctor suite
        run: |
          cp "$RUNNER_TEMP/doctor-r2/candidate-doctor.ts" packages/cli/src/commands/doctor.ts
          npx vitest run packages/cli/test/doctor.test.ts --reporter=json --outputFile="$RUNNER_TEMP/doctor-r2/candidate.json" > "$RUNNER_TEMP/doctor-r2/candidate.log" 2>&1
          python3 - <<'PYCODE'
          import json,os,pathlib
          x=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'doctor-r2/candidate.json').read_text())
          print(json.dumps({k:x[k] for k in ['numPassedTests','numFailedTests','numPendingTests']}))
          assert x['numFailedTests']==0
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doctor-r2-wording
          path: ${{ runner.temp }}/doctor-r2/
          if-no-files-found: error
