name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  compact-unconfirmed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a068441c7abbe855cc222e1f101c2ad2fc6ec984
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cancellation and affected compaction regressions
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/compaction-command-submission.test.ts test/compaction-preparation.test.ts test/compaction-generation.test.ts test/compaction-routes.test.ts test/compaction-drain-readiness.test.ts test/claude-compaction-enforcer.test.ts test/compaction-draft-aware.test.ts test/compaction-clock-injection.test.ts test/claude-idle-compaction.test.ts test/context-monitor-compaction-race.test.ts test/managed-compaction-effect.test.ts test/send-during-compaction-notice.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm --workspace @openrig/cli test -- test/compact.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
          cli_result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ncli=%s\ntypecheck=%s\n' "$result" "$cli_result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$cli_result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-unconfirmed-green
          path: proof/
          if-no-files-found: error
