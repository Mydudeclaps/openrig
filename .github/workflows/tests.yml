name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-historical-address:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 45e7f54349c07f812b22596c3ba73639191d08a8
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Address admission and downstream identity preservation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          tmux -V > proof/tmux-version.txt
          npm --workspace @openrig/daemon test -- test/seat-handover-service.test.ts --reporter=verbose 2>&1 | tee proof/premise.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\n' "$result" > proof/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-handover-retained-completion
          path: proof/
          if-no-files-found: error
