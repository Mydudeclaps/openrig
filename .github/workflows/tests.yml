name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  partial-up-guidance-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2c5d1307ee1b79af7dff386786f347aed8d8bd84
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Six partial-result guidance assertions fail on unchanged main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          set +e
          npm --workspace @openrig/daemon test -- test/bootstrap-orchestrator.test.ts -t 'cleanup failure accounting' --reporter=verbose 2>&1 | tee proof/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q '6 failed' proof/red.log
          grep -q '6 passed' proof/red.log
          ! grep -q 'Unhandled Errors' proof/red.log
          git diff --exit-code > proof/source-unchanged.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-up-guidance-red
          path: proof/
          if-no-files-found: error
