name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fix-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dcda0376fc55f84ea11d8e714c6008464c877252
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bound baseline red then candidate green
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD HEAD^ HEAD^{tree} > "$RUNNER_TEMP/proof/checkout.txt"
          id > "$RUNNER_TEMP/proof/uid.txt"
          sha256sum packages/daemon/src/domain/claude-compaction-enforcer.ts packages/cli/src/commands/compact.ts packages/daemon/test/compaction-preparation.test.ts packages/cli/test/compact.test.ts > "$RUNNER_TEMP/proof/before.sha256"
          git show 78f0d5d79ce2403a0b291a637b18251cbdf5b753:packages/daemon/src/domain/claude-compaction-enforcer.ts > packages/daemon/src/domain/claude-compaction-enforcer.ts
          git show 78f0d5d79ce2403a0b291a637b18251cbdf5b753:packages/cli/src/commands/compact.ts > packages/cli/src/commands/compact.ts
          sha256sum packages/daemon/src/domain/claude-compaction-enforcer.ts packages/cli/src/commands/compact.ts packages/daemon/test/compaction-preparation.test.ts packages/cli/test/compact.test.ts > "$RUNNER_TEMP/proof/red.sha256"
          set +e
          npm exec -w packages/daemon -- vitest run test/compaction-preparation.test.ts -t 'manual attention clears|manual unresolved attention|manual default accepts|manual default refuses' --reporter=json --outputFile="$RUNNER_TEMP/proof/red-daemon.json"
          daemon_exit=$?
          npm exec -w packages/cli -- vitest run test/compact.test.ts -t 'manual request allows 240|manual help binds180' --reporter=json --outputFile="$RUNNER_TEMP/proof/red-cli.json"
          cli_exit=$?
          set -e
          printf '%s %s\n' "$daemon_exit" "$cli_exit" > "$RUNNER_TEMP/proof/red.exit"
          test "$daemon_exit" -ne 0
          test "$cli_exit" -ne 0
          python3 - "$RUNNER_TEMP/proof" <<'PYTHON'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          for name,count in [('red-daemon.json',4),('red-cli.json',2)]:
           r=json.loads((p/name).read_text())
           assert r['numFailedTests']==count and r['numPassedTests']==0,(name,r)
           failures=[a for f in r['testResults'] for a in f['assertionResults'] if a['status']=='failed']
           assert len(failures)==count and all(a['failureMessages'] for a in failures)
          PYTHON
          git show HEAD:packages/daemon/src/domain/claude-compaction-enforcer.ts > packages/daemon/src/domain/claude-compaction-enforcer.ts
          git show HEAD:packages/cli/src/commands/compact.ts > packages/cli/src/commands/compact.ts
          git show HEAD:packages/daemon/test/compaction-preparation.test.ts > packages/daemon/test/compaction-preparation.test.ts
          git show HEAD:packages/cli/test/compact.test.ts > packages/cli/test/compact.test.ts
          npm exec -w packages/daemon -- vitest run test/compaction-preparation.test.ts test/claude-compaction-enforcer.test.ts test/managed-compaction-effect.test.ts --reporter=json --outputFile="$RUNNER_TEMP/proof/green-daemon.json"
          npm exec -w packages/cli -- vitest run test/compact.test.ts --reporter=json --outputFile="$RUNNER_TEMP/proof/green-cli.json"
          sha256sum packages/daemon/src/domain/claude-compaction-enforcer.ts packages/cli/src/commands/compact.ts packages/daemon/test/compaction-preparation.test.ts packages/cli/test/compact.test.ts > "$RUNNER_TEMP/proof/after.sha256"
          diff -u "$RUNNER_TEMP/proof/before.sha256" "$RUNNER_TEMP/proof/after.sha256"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-refocus-a
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
  fix-b:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 70bfb9b01905720ac749c55d4e86399396043c5e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bound baseline red then candidate green
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          git rev-parse HEAD HEAD^ HEAD^{tree} > "$RUNNER_TEMP/proof/checkout.txt"
          id > "$RUNNER_TEMP/proof/uid.txt"
          sha256sum packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py packages/daemon/test/refocus-context-ref.test.ts packages/daemon/test/refocus-notes-local.test.ts > "$RUNNER_TEMP/proof/before.sha256"
          git show 78f0d5d79ce2403a0b291a637b18251cbdf5b753:packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py > packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py
          sha256sum packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py packages/daemon/test/refocus-context-ref.test.ts packages/daemon/test/refocus-notes-local.test.ts > "$RUNNER_TEMP/proof/red.sha256"
          set +e
          npm exec -w packages/daemon -- vitest run test/refocus-context-ref.test.ts -t 'local notes avoid a delayed CLI' --reporter=json --outputFile="$RUNNER_TEMP/proof/red-daemon.json"
          red_exit=$?
          set -e
          printf '%s\n' "$red_exit" > "$RUNNER_TEMP/proof/red.exit"
          test "$red_exit" -ne 0
          python3 - "$RUNNER_TEMP/proof" <<'PYTHON'
          import json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          r=json.loads((p/'red-daemon.json').read_text())
          assert r['numFailedTests']==1 and r['numPassedTests']==0,r
          failures=[a for f in r['testResults'] for a in f['assertionResults'] if a['status']=='failed']
          assert len(failures)==1 and 'local notes avoid a delayed CLI' in failures[0]['fullName'] and failures[0]['failureMessages']
          PYTHON
          git show HEAD:packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py > packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py
          git show HEAD:packages/daemon/test/refocus-context-ref.test.ts > packages/daemon/test/refocus-context-ref.test.ts
          git show HEAD:packages/daemon/test/refocus-notes-local.test.ts > packages/daemon/test/refocus-notes-local.test.ts
          npm exec -w packages/daemon -- vitest run test/refocus-context-ref.test.ts test/refocus-notes-local.test.ts test/refocus-work-packet.test.ts test/refocus-budget-concurrency.test.ts --reporter=json --outputFile="$RUNNER_TEMP/proof/green-daemon.json"
          sha256sum packages/daemon/assets/plugins/openrig-core/skills/refocusing/scripts/trace-to-root.py packages/daemon/test/refocus-context-ref.test.ts packages/daemon/test/refocus-notes-local.test.ts > "$RUNNER_TEMP/proof/after.sha256"
          diff -u "$RUNNER_TEMP/proof/before.sha256" "$RUNNER_TEMP/proof/after.sha256"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-refocus-b
          path: ${{ runner.temp }}/proof/
          if-no-files-found: error
