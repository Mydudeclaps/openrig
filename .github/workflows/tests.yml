name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  partial-up-command-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 95d13031546b4da93563f349bc90b077bf34a7d9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Actual main command help and unknown-option boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof "$RUNNER_TEMP/empty-home"
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          export HOME="$RUNNER_TEMP/empty-home"
          node packages/cli/dist/bin-wrapper.js launch --help | tee proof/launch-help.txt
          node packages/cli/dist/bin-wrapper.js up --help | tee proof/up-help.txt
          grep -q -- '--env <KEY=VALUE>' proof/up-help.txt
          ! grep -q -- '--env' proof/launch-help.txt
          set +e
          node packages/cli/dist/bin-wrapper.js launch retained-rig failed-seat --env CHECK=synthetic > proof/launch-env.txt 2>&1
          rc=$?
          set -e
          cat proof/launch-env.txt
          test "$rc" -ne 0
          grep -q "unknown option '--env'" proof/launch-env.txt
          git diff --exit-code > proof/source-unchanged.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-up-command-boundary
          path: proof/
          if-no-files-found: error
