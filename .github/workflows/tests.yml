name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9d6cfbf5d23a025b478fa660e27cfd1068613f2e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - name: CLI worker-entry fixture compatibility
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/cli test -- test/project-worker-entry.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
          cli=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'cli=%s\n' "$cli" > proof/exits.txt
          test "$cli" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-r5-cli-fixture
          path: proof/
          if-no-files-found: error
