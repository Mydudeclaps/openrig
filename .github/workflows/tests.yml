name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tmux-environment-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dff2a218c06e48622990b9b5f272086729f17107
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: brew install tmux
      - run: npm ci
      - run: npm run build
      - name: Corrected fixture and argv preservation on macOS
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          tmux -V > proof/tmux-version.txt
          npm --workspace @openrig/daemon test -- test/tmux-agent-environment.test.ts test/tmux-argv-legacy-equivalence.test.ts --reporter=verbose 2>&1 | tee proof/macos.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\n' "$result" > proof/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmux-environment-r3-macos
          path: proof/
          if-no-files-found: error
