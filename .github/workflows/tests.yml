name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cmux-remedy-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: caddbfd75990f5b26ca961cb4fbcc967ba83c9e6
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Complete only the corrected default-mode and generic-warning assertions
        run: npx vitest run packages/cli/test/doctor.test.ts -t 'shell cmux pass \+ daemon cmux unavailable|compatible password mode'
