name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  fresh-in-place-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f7213dfa08a2da609830151b04e9efff4228d612
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind source and regression fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue1544"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue1544/checkout.txt"
          for name in claude-handover-readiness claude-fresh-in-place-scope; do
            git show "$GITHUB_SHA:packages/daemon/test/$name.test.ts" > "packages/daemon/test/$name.test.ts"
          done
          sha256sum packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/runtime-adapter.ts packages/daemon/src/domain/successor-session-launcher.ts packages/daemon/test/claude-handover-readiness.test.ts packages/daemon/test/claude-fresh-in-place-scope.test.ts > "$RUNNER_TEMP/issue1544/bindings.before.txt"
      - name: Real service chronology and scoped selector
        run: |
          set -euo pipefail
          set +e
          CHECKPOINT_OUTPUT="$RUNNER_TEMP/issue1544" npm exec -w packages/daemon -- vitest run test/claude-handover-readiness.test.ts test/claude-fresh-in-place-scope.test.ts -t "accept-edits-unavailable|keeps unknown identity unknown" --reporter verbose > "$RUNNER_TEMP/issue1544/test.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/issue1544/test.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/issue1544/test-exit.txt"
          test "$code" -eq 1
          git diff --exit-code -- packages/daemon/src
          sha256sum packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/runtime-adapter.ts packages/daemon/src/domain/successor-session-launcher.ts packages/daemon/test/claude-handover-readiness.test.ts packages/daemon/test/claude-fresh-in-place-scope.test.ts > "$RUNNER_TEMP/issue1544/bindings.after.txt"
          diff -u "$RUNNER_TEMP/issue1544/bindings.before.txt" "$RUNNER_TEMP/issue1544/bindings.after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-in-place-round2-red
          path: ${{ runner.temp }}/issue1544/
          if-no-files-found: error
