name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  usage-host-fixture-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 71d9332ee
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bind candidate and verify the expired baseline regression
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/usage-clock"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/usage-clock/checkout.txt"
          sha256sum packages/daemon/test/helpers/usage-hosts-harness.ts packages/daemon/test/provider-usage-across-hosts.test.ts packages/daemon/test/chat-repository.test.ts > "$RUNNER_TEMP/usage-clock/bindings.before.txt"
          cp packages/daemon/test/helpers/usage-hosts-harness.ts "$RUNNER_TEMP/usage-clock/candidate.ts"
          git show f332ee68:packages/daemon/test/helpers/usage-hosts-harness.ts > packages/daemon/test/helpers/usage-hosts-harness.ts
          set +e
          npm exec -w packages/daemon -- vitest run test/provider-usage-across-hosts.test.ts -t 'a refresh slower than the 5 s read class still succeeds' --reporter verbose > "$RUNNER_TEMP/usage-clock/red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/usage-clock/red.log"
          printf '%s\n' "$code" > "$RUNNER_TEMP/usage-clock/red.exit"
          test "$code" -ne 0
          grep -q 'nearing' "$RUNNER_TEMP/usage-clock/red.log"
          grep -q 'unknown' "$RUNNER_TEMP/usage-clock/red.log"
          grep -q 'AssertionError' "$RUNNER_TEMP/usage-clock/red.log"
          cp "$RUNNER_TEMP/usage-clock/candidate.ts" packages/daemon/test/helpers/usage-hosts-harness.ts
      - name: Verify repaired daemon fixtures and shared CLI and TUI callers
        run: |
          set -euo pipefail
          npm exec -w packages/daemon -- vitest run test/provider-usage-across-hosts.test.ts test/chat-repository.test.ts --reporter verbose > "$RUNNER_TEMP/usage-clock/daemon.log" 2>&1
          cat "$RUNNER_TEMP/usage-clock/daemon.log"
          npm exec -w packages/cli -- vitest run test/provider-usage-across-hosts.test.ts test/keeping-a-watch-usage-doc.test.ts --reporter verbose > "$RUNNER_TEMP/usage-clock/cli.log" 2>&1
          cat "$RUNNER_TEMP/usage-clock/cli.log"
          npm exec -w packages/tui -- vitest run test/usage-hosts-journey.test.ts --reporter verbose > "$RUNNER_TEMP/usage-clock/tui.log" 2>&1
          cat "$RUNNER_TEMP/usage-clock/tui.log"
          sha256sum packages/daemon/test/helpers/usage-hosts-harness.ts packages/daemon/test/provider-usage-across-hosts.test.ts packages/daemon/test/chat-repository.test.ts > "$RUNNER_TEMP/usage-clock/bindings.after.txt"
          diff -u "$RUNNER_TEMP/usage-clock/bindings.before.txt" "$RUNNER_TEMP/usage-clock/bindings.after.txt"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: usage-host-fixture-clock
          path: ${{ runner.temp }}/usage-clock/
          if-no-files-found: error
