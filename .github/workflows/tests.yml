name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  legacy-env-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Synthetic flat and v1 launch environment regression
        run: npx vitest run packages/daemon/test/bootstrap-orchestrator.test.ts -t 'one-off launch environment'
