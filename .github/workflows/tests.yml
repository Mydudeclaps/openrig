name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-address-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 551d6171b925f227fd73844b7e8f12a62352551b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Attach address and collision regression before implementation
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/self-attach-address.test.ts --reporter=verbose 2>&1 | tee proof/red.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-address-red
          path: proof/
          if-no-files-found: error
