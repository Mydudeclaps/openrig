name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  attach-name-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/daemon
      - name: Check whether a logical reply address reaches a raw tmux binding
        run: |
          mkdir evidence
          set +e
          npm run test -w packages/daemon -- test/self-attach-reply-address.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/reply-address.json" > evidence/reply-address.log 2>&1
          code=$?
          printf '%s\n' "$code" > evidence/reply-address.exit
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-name-evidence
          path: evidence/
