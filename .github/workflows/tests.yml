name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  issue1533-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind unchanged production source and diagnosis fixture
        run: |
          mkdir -p "$RUNNER_TEMP/issue1533"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue1533/checkout.txt"
          git diff --exit-code a1f6a808d0e26c5e40f02b4e739613553d058858 HEAD -- packages/daemon/src packages/shared/src
          git diff --stat a1f6a808d0e26c5e40f02b4e739613553d058858 HEAD > "$RUNNER_TEMP/issue1533/delta.txt"
          sha256sum packages/daemon/src/domain/session-transport.ts packages/daemon/src/domain/composer-prompts.ts packages/daemon/test/issue1533-diagnosis.test.ts > "$RUNNER_TEMP/issue1533/bindings.txt"
      - name: Diagnose actual classifier and guarded SessionTransport seam
        run: CHECKPOINT_OUTPUT="$RUNNER_TEMP/issue1533" npm exec -w packages/daemon -- vitest run test/issue1533-diagnosis.test.ts --reporter verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1533-diagnosis
          path: ${{ runner.temp }}/issue1533/
          if-no-files-found: error
