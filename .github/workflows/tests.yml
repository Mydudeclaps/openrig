name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cleanup-results-and-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c6d41cb90154585f1f1eca815085c086fe69318e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Original main ignores the override and reaches no cleanup fault
        run: |
          git checkout aa097e6dc8b035934a6a4376110d687018ca7d17 -- packages/daemon/src/domain/types.ts packages/daemon/src/domain/rigspec-instantiator.ts packages/daemon/src/domain/bootstrap-orchestrator.ts packages/cli/src/commands/up.ts packages/cli/src/commands/bundle.ts
          EXPECT_ENV_CLEANUP_BASELINE=1 npx vitest run packages/daemon/test/bootstrap-orchestrator.test.ts -t 'cleanup failure accounting'
      - name: Prior forwarding head must expose exactly twelve missing failure-reporting assertions
        run: |
          git checkout 9ba51dc2733160d867f0f7bf418d725b7bd3c1fd -- packages/daemon/src/domain/types.ts packages/daemon/src/domain/rigspec-instantiator.ts packages/daemon/src/domain/bootstrap-orchestrator.ts packages/cli/src/commands/up.ts packages/cli/src/commands/bundle.ts
          set +e
          npx vitest run packages/daemon/test/bootstrap-orchestrator.test.ts -t 'cleanup failure accounting' --reporter=json --outputFile=/tmp/cleanup-prior.json
          result=$?
          set -e
          test "$result" = 1
          node -e 'const r=require("/tmp/cleanup-prior.json"); const f=r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==="failed"); if(r.numFailedTests!==12 || r.numPassedTests!==0 || f.length!==12 || f.some(x=>!x.fullName.includes("cleanup failure accounting")))process.exit(1); console.log("Exactly12 prior forwarding-head cleanup-accounting target failures.")'
      - name: Candidate preserves cleanup guidance and non-success results with effects measured
        run: |
          git checkout c6d41cb90154585f1f1eca815085c086fe69318e -- packages/daemon/src/domain/types.ts packages/daemon/src/domain/rigspec-instantiator.ts packages/daemon/src/domain/bootstrap-orchestrator.ts packages/cli/src/commands/up.ts packages/cli/src/commands/bundle.ts
          npx vitest run packages/daemon/test/bootstrap-orchestrator.test.ts packages/daemon/test/rigspec-instantiator.test.ts packages/daemon/test/up-route-env.test.ts packages/daemon/test/node-launcher-one-off-env.test.ts packages/daemon/test/seat-env.test.ts packages/cli/test/up.test.ts packages/cli/test/bundle.test.ts
