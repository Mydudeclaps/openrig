name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-r2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7a21b122809a04b68168201caaf60a2029b18460
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - name: Replacement generation registration
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/yaml-import-replaces-stopped-generation.test.ts test/archived-generation-pod-shrink.test.ts test/seat-handover-service.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\n' "$result" > proof/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-r2-scope-red
          path: proof/
          if-no-files-found: error
