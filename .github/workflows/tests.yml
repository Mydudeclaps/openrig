name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-historical-address:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e9d22b0e4199312ea680aa7112dae6b3e6ab9b2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Address admission and downstream identity preservation
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          tmux -V > proof/tmux-version.txt
          npm --workspace @openrig/daemon test -- test/self-attach-address.test.ts test/self-attach-service.test.ts test/session-registry.test.ts test/seat-delivery-guard.test.ts test/seat-delivery-guard-correction.test.ts test/session-transport.test.ts test/queue-repository.test.ts test/whoami-service.test.ts test/agent-activity-store.test.ts test/context-usage-store.test.ts test/transcript-routes.test.ts test/claim-service.test.ts test/seat-handover-service.test.ts test/node-launcher.test.ts test/restore-orchestrator.test.ts test/node-inventory.test.ts test/attach-terminal-activity-and-work.test.ts --reporter=verbose 2>&1 | tee proof/premise.log
          result=${PIPESTATUS[0]}
          npm --workspace @openrig/cli test -- test/attach.test.ts test/attach-reply-address.test.ts test/whoami.test.ts test/whoami-bounded-peers.test.ts test/whoami-host-hint.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
          cli=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ncli=%s\n' "$result" "$cli" > proof/exits.txt
          if [ "$result" != 0 ] || [ "$cli" != 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-address-integration-a
          path: proof/
          if-no-files-found: error
