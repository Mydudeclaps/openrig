name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  o1-transport-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record source bindings and retain candidate
        run: |
          mkdir -p "$RUNNER_TEMP/o1-evidence" "$RUNNER_TEMP/o1-candidate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/o1-evidence/candidate-binding.txt"
          git rev-parse ae65fe7865c20a32bb503f7e88e39ead08826154^{tree} > "$RUNNER_TEMP/o1-evidence/base-binding.txt"
          sha256sum packages/daemon/test/issue498-o1-checkpoint.test.ts > "$RUNNER_TEMP/o1-evidence/fixture-sha256.txt"
          cp packages/daemon/src/domain/session-transport.ts "$RUNNER_TEMP/o1-candidate/session-transport.ts"
          git diff ae65fe7865c20a32bb503f7e88e39ead08826154 -- packages/daemon/src/domain/session-transport.ts > "$RUNNER_TEMP/o1-evidence/candidate.patch"
      - name: Measure current main through the production transport seam
        id: baseline
        continue-on-error: true
        run: |
          git show ae65fe7865c20a32bb503f7e88e39ead08826154:packages/daemon/src/domain/session-transport.ts > packages/daemon/src/domain/session-transport.ts
          CHECKPOINT_OUTPUT="$RUNNER_TEMP/o1-evidence/base" npm exec -w packages/daemon -- vitest run test/issue498-o1-checkpoint.test.ts --reporter verbose
      - name: Measure the bounded candidate with identical fixture bytes
        id: candidate
        continue-on-error: true
        run: |
          cp "$RUNNER_TEMP/o1-candidate/session-transport.ts" packages/daemon/src/domain/session-transport.ts
          CHECKPOINT_OUTPUT="$RUNNER_TEMP/o1-evidence/candidate" npm exec -w packages/daemon -- vitest run test/issue498-o1-checkpoint.test.ts --reporter verbose
      - name: Compare recorded effects without calling ordinary refusals a success
        if: always()
        env:
          BASE_OUTCOME: ${{ steps.baseline.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.candidate.outcome }}
        run: |
          python3 - <<'PYCODE'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'o1-evidence'
          base=json.loads((root/'base/observations.json').read_text())
          candidate=json.loads((root/'candidate/observations.json').read_text())
          assert len(base)==len(candidate)==36
          rows=[]
          for a,b in zip(base,candidate):
            assert (a['id'],a['hook'],a['pane'],a['intent'])==(b['id'],b['hook'],b['pane'],b['intent'])
            rows.append({'id':b['id'],'hook':b['hook'],'intent':b['intent'],
              'base_ok':a['result']['ok'],'candidate_ok':b['result']['ok'],
              'base_reason':a['result'].get('reason'),'candidate_reason':b['result'].get('reason'),
              'base_pastes':a['pasteCount'],'candidate_pastes':b['pasteCount'],
              'base_keys':a['keysCount'],'candidate_keys':b['keysCount']})
          regressions=[r for r in rows if r['intent']=='deliver' and r['base_ok'] and not r['candidate_ok']]
          report={'measurement_steps':[os.environ['BASE_OUTCOME'],os.environ['CANDIDATE_OUTCOME']],
            'rows':rows,'new_ordinary_refusals':regressions,'stop_for_tradeoff':bool(regressions)}
          (root/'comparison.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps({'records_per_cut':len(base),'new_ordinary_refusals':len(regressions),
            'stop_for_tradeoff':bool(regressions),'measurement_steps':report['measurement_steps']}))
          assert report['measurement_steps']==['success','success']
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue498-o1-checkpoint
          path: ${{ runner.temp }}/o1-evidence/
          if-no-files-found: error
