name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  legacy-env-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9ba51dc2733160d867f0f7bf418d725b7bd3c1fd
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Launch path and lifetime preservation
        run: npx vitest run packages/daemon/test/bootstrap-orchestrator.test.ts packages/daemon/test/rigspec-instantiator.test.ts packages/daemon/test/up-route-env.test.ts packages/daemon/test/node-launcher-one-off-env.test.ts packages/daemon/test/seat-env.test.ts
  guidance-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 508f1be23e3cbacc78f1d946011c0bafcf7ef0b5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prior provider rendering must miss exactly the two new guidance assertions
        run: |
          git checkout aa097e6dc8b035934a6a4376110d687018ca7d17 -- packages/cli/src/commands/provider.ts
          set +e
          npx vitest run packages/cli/test/provider-moves-cli.test.ts packages/cli/test/provider-usage-windows.test.ts -t 'explains how to name an actor|shows why current availability' --reporter=json --outputFile=/tmp/guidance-red.json
          result=$?
          set -e
          test "$result" = 1
          node -e 'const r=require("/tmp/guidance-red.json"); if(r.numFailedTests!==2 || r.numPassedTests!==0)process.exit(1); const failed=r.testResults.flatMap(x=>x.assertionResults).filter(x=>x.status==="failed"); if(failed.length!==2 || !failed.some(x=>x.title.includes("explains how to name an actor")) || !failed.some(x=>x.title.includes("shows why current availability")))process.exit(1); console.log("Two intended guidance assertions failed; no other selected tests.")'
          git checkout 508f1be23e3cbacc78f1d946011c0bafcf7ef0b5 -- packages/cli/src/commands/provider.ts
      - name: Guidance and existing binding-repair preservation
        run: npx vitest run packages/cli/test/provider-moves-cli.test.ts packages/cli/test/provider-usage-windows.test.ts packages/cli/test/provider.test.ts packages/cli/test/config.test.ts packages/cli/test/scope-approve-workspace.test.ts packages/cli/test/queue-read-compact.test.ts packages/daemon/test/compaction-routes.test.ts packages/daemon/test/reconcile-session.test.ts
