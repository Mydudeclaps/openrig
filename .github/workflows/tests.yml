name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  shared-dialog-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a58c13b3f0d1791cf145b8c375553e47ee8a6f24
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bind unchanged main source and the private diagnostic fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/issue1541"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/issue1541/checkout.txt"
          git diff --exit-code
          git show "$GITHUB_SHA:packages/daemon/test/issue1541-diagnosis.test.ts" > packages/daemon/test/issue1541-diagnosis.test.ts
          sha256sum packages/daemon/src/domain/native-resume-probe.ts packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/session-transport.ts packages/daemon/test/issue1541-diagnosis.test.ts > "$RUNNER_TEMP/issue1541/bindings.before.txt"
      - name: Observe old and new MCP menus through actual assessment, readiness and HTTP send
        run: |
          set -euo pipefail
          CHECKPOINT_OUTPUT="$RUNNER_TEMP/issue1541" npm exec -w packages/daemon -- vitest run test/issue1541-diagnosis.test.ts --reporter verbose | tee "$RUNNER_TEMP/issue1541/test.log"
          git diff --exit-code -- packages/daemon/src
          sha256sum packages/daemon/src/domain/native-resume-probe.ts packages/daemon/src/adapters/claude-code-adapter.ts packages/daemon/src/domain/session-transport.ts packages/daemon/test/issue1541-diagnosis.test.ts > "$RUNNER_TEMP/issue1541/bindings.after.txt"
          diff -u "$RUNNER_TEMP/issue1541/bindings.before.txt" "$RUNNER_TEMP/issue1541/bindings.after.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue1541-shared-dialog-diagnosis
          path: ${{ runner.temp }}/issue1541/
          if-no-files-found: error
