name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-address-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c528b2a889ca5d5a16ad156be15fe7106fcead31
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Core address correction and existing attach/registry checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/self-attach-address.test.ts test/self-attach-service.test.ts test/session-registry.test.ts --reporter=verbose 2>&1 | tee proof/green.log
          git diff --exit-code > proof/source-unchanged.txt
          npm --workspace @openrig/cli test -- test/attach.test.ts test/whoami.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-address-core
          path: proof/
          if-no-files-found: error
