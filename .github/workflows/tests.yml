name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  s22-queue-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ae3a9cdba2fa03ad1e9d5930a1fbd7e9e1735548
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Current queue wake recovery regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/workflow-boot-wake-recovery.test.ts test/startup-wake-recovery.test.ts test/draft-aware-delivery.test.ts test/queue-transactional-closure.test.ts test/queue-wake-input-box.test.ts test/workflow-exception-stuck.test.ts test/workflow-boot-sweep.test.ts test/queue-park-wake.test.ts test/queue-repository.test.ts test/queue-wake-ladder.test.ts test/p34-terminal-closing-writers.test.ts test/outbox-handler.test.ts test/seat-delivery-guard.test.ts test/typing-guard-modes.test.ts test/qa-draft-caller-cancel.test.ts test/qa-send-caller-cancel.test.ts test/send-caller-cancel.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s22-queue-recovery-r2green
          path: proof/
          if-no-files-found: error
