name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tmux-environment-premise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 226646cc3b7b4c1a9387ebf43a0f099788649d0a
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Qualify stock inheritance and clean prototype before product changes
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          tmux -V > proof/tmux-version.txt
          npm --workspace @openrig/daemon test -- test/tmux-environment-premise.test.ts --reporter=verbose 2>&1 | tee proof/premise.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'test=%s\n' "$result" > proof/exits.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmux-environment-premise
          path: proof/
          if-no-files-found: error
