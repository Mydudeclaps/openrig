name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  slack-answer-after-question-red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 73263a97740ffb7bbe817ed40b138676625d3a51
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Three early-reply REDs and the later-reply control
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          set +e
          npm --workspace @openrig/daemon test -- test/slack-answer-after-question.test.ts --reporter=verbose 2>&1 | tee proof/red.log
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0
          grep -q '3 failed' proof/red.log
          grep -q '1 passed' proof/red.log
          ! grep -q 'Unhandled Errors' proof/red.log
          git diff --exit-code > proof/source-unchanged.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slack-answer-after-question-red
          path: proof/
          if-no-files-found: error
