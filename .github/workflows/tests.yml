name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  refocus-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b8d0c57963c25e9f52c779bcd238b23ccec9ca9
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bounded pasted-envelope regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/refocus-continuation.test.ts test/refocus-managed-result.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\n' "$result" > proof/exits.txt
          test "$result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refocus-envelope-red
          path: proof/
          if-no-files-found: error
