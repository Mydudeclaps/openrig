name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  stopped-fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 20d2ca7c55585aba6c328e1fbca1b01e03d5318e
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
      - run: npm run build
      - name: Stopped fresh occupant down and up before correction
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/stopped-fresh-up.test.ts -t "apply without a plan" --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\n' "$result" > proof/exits.txt
          test "$result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stopped-fresh-apply-red
          path: proof/
          if-no-files-found: error
