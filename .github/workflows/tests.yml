name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  refocus-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 031a3942cf671176ab5c839cadd46e0656458be6
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bounded pasted-envelope regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/refocus-continuation.test.ts test/refocus-managed-result.test.ts test/refocus-context-ref.test.ts test/refocus-notes-local.test.ts test/refocus-occupant-baseline.test.ts test/refocus-role.test.ts test/refocus-work-packet.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refocus-envelope-green
          path: proof/
          if-no-files-found: error
