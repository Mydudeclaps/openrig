name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/daemon
      - name: Capture the known inspect regression and ordinary v1 head bytes
        run: |
          set -euo pipefail
          mkdir evidence
          set +e
          npm run test -w packages/daemon -- test/bundle-login-files.test.ts -t 'inspect keeps a malformed login record diagnostic' --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/inspect-red.json" > evidence/inspect-red.log 2>&1
          result=$?
          set -e
          test "$result" = 1
          python3 - <<'CHECK'
          import json
          r=json.load(open('evidence/inspect-red.json'))
          cases=[a for t in r['testResults'] for a in t['assertionResults']]
          selected=[a for a in cases if a['status']!='pending']
          assert len(selected)==2, selected
          failed=[a for a in selected if a['status']=='failed']
          assert len(failed)==1 and 'v1 inspect' in failed[0]['title'], selected
          assert '500' in '\n'.join(failed[0]['failureMessages'])
          CHECK
          BUNDLE_ARCHIVE_CAPTURE="$GITHUB_WORKSPACE/evidence/head-v1.rigbundle" npm run test -w packages/daemon -- test/bundle-v1-byte-probe.test.ts > evidence/head-bytes.log 2>&1
      - name: Capture exact base v1 bytes with the unchanged fixture
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/bundle-baseline"
          git worktree add --detach "$baseline" ce7f89cc3c09b6b7dfcd842eddbdfb595a961259
          cp packages/daemon/test/bundle-v1-byte-probe.test.ts "$baseline/packages/daemon/test/bundle-v1-byte-probe.test.ts"
          cd "$baseline"
          npm ci
          npm run build -w packages/daemon
          BUNDLE_ARCHIVE_CAPTURE="$GITHUB_WORKSPACE/evidence/base-v1.rigbundle" npm run test -w packages/daemon -- test/bundle-v1-byte-probe.test.ts > "$GITHUB_WORKSPACE/evidence/base-bytes.log" 2>&1
          cmp "$GITHUB_WORKSPACE/evidence/base-v1.rigbundle" "$GITHUB_WORKSPACE/evidence/head-v1.rigbundle"
          sha256sum "$GITHUB_WORKSPACE/evidence/"*.rigbundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-round2-evidence
          path: evidence/
