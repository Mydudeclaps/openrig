name: Tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate the corrected inspect and messages, and capture ordinary v1 head bytes
        run: |
          set -euo pipefail
          mkdir evidence
          npm run test -w packages/daemon -- test/bundle-login-files.test.ts test/bundle-routes.test.ts test/bundle-binary-bytes.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/daemon-green.json" > evidence/daemon-green.log 2>&1
          npm run test -w packages/cli -- test/bundle-login-files.test.ts test/bundle-source.test.ts --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/cli-green.json" > evidence/cli-green.log 2>&1
          npm run test -w packages/ui -- test/bundle-inspector.test.tsx --reporter=json --outputFile="$GITHUB_WORKSPACE/evidence/ui-green.json" > evidence/ui-green.log 2>&1
          npm run lint > evidence/lint.log 2>&1
          node scripts/check-docs-guard.mjs > evidence/docs.log 2>&1
          BUNDLE_ARCHIVE_CAPTURE="$GITHUB_WORKSPACE/evidence/head-v1.rigbundle" npm run test -w packages/daemon -- test/bundle-v1-byte-probe.test.ts > evidence/head-bytes.log 2>&1
      - name: Capture exact base v1 bytes with the unchanged fixture
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/bundle-baseline"
          git worktree add --detach "$baseline" ce7f89cc3c09b6b7dfcd842eddbdfb595a961259
          cp packages/daemon/test/bundle-v1-byte-probe.test.ts "$baseline/packages/daemon/test/bundle-v1-byte-probe.test.ts"
          cd "$baseline"
          npm ci
          npm run build -w packages/daemon
          BUNDLE_ARCHIVE_CAPTURE="$GITHUB_WORKSPACE/evidence/base-v1.rigbundle" npm run test -w packages/daemon -- test/bundle-v1-byte-probe.test.ts > "$GITHUB_WORKSPACE/evidence/base-bytes.log" 2>&1
          cmp "$GITHUB_WORKSPACE/evidence/base-v1.rigbundle" "$GITHUB_WORKSPACE/evidence/head-v1.rigbundle"
          sha256sum "$GITHUB_WORKSPACE/evidence/"*.rigbundle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-round2-evidence
          path: evidence/
