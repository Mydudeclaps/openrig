name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  parked-wake-compaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b69b6d3c224e9c6d3c5dfdc0e998875e4df9a66f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Parked wake and managed restore regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/parked-owner-compaction.test.ts test/parked-owner-consumer.test.ts test/watchdog-policy-engine.test.ts test/watchdog-delivery-guarded.test.ts test/watchdog-target-gen-wiring.test.ts test/watchdog-scheduler.test.ts test/watchdog-park-reminder-digest.test.ts test/compaction-generation.test.ts test/compaction-command-submission.test.ts test/compaction-drain-readiness.test.ts test/claude-compaction-enforcer.test.ts test/send-during-compaction-notice.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parked-wake-compaction-green
          path: proof/
          if-no-files-found: error
