name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  attach-address-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 579f702a19a624cd4cc499fc8d12a8c79b0585e5
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Address integration and affected identity consumers
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/cli test -- test/attach-reply-address.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
          cli_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'cli=%s\n' "$cli_result" > proof/exits.txt
          exit "$cli_result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attach-address-cli-completion
          path: proof/
          if-no-files-found: error
