name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  model-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bb4b892e8d7e2ce47cf9f5b520804c0c1772dd45
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Composed wrapper identity regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          npm --workspace @openrig/daemon test -- test/current-model-reader.test.ts test/current-generation-record.test.ts test/seat-identity-reconciler.test.ts test/seat-attention-reconciler.test.ts test/model-divergence-monitor.test.ts test/seat-identity-pane-pid.test.ts test/migration-fixture-parity.test.ts test/startup-migrations-mirror.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-wrapper-green
          path: proof/
          if-no-files-found: error
