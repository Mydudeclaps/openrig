name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  notice-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da059e59839a30369e489d404994429e89f44197
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: npm ci
      - run: npm run build
      - name: Hook child interpreter regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/precompact-hook.test.ts test/refocus-context-ref.test.ts test/refocus-managed-result.test.ts test/refocus-work-packet.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          npm run mirror-skills:check 2>&1 | tee proof/mirror.log
          mirror_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          echo "mirror=$mirror_result" >> proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0 && test "$mirror_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hook-child-node-green
          path: proof/
          if-no-files-found: error
