name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  missing-pane-message:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9c379977c976ef3969e13ed33a4f57c3999f7227
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
      - run: npm ci
      - run: npm run build
      - name: Unsupported-route guidance RED then GREEN
        run: |
          set -euo pipefail
          file=packages/cli/src/commands/reconcile-session.ts
          cp "$file" "$RUNNER_TEMP/reconcile-candidate.ts"
          git fetch --no-tags --depth=1 origin 37af3727cbf53cebc5427fc17f251b5e1f564e53
          git show 37af3727cbf53cebc5427fc17f251b5e1f564e53:"$file" > "$file"
          trap 'cp "$RUNNER_TEMP/reconcile-candidate.ts" "$file"' EXIT
          set +e
          npm --workspace @openrig/cli test -- test/reconcile-session.test.ts -t "explains an old daemon" --reporter=verbose 2>&1 | tee proof/red.log
          red_rc=${PIPESTATUS[0]}
          set -e
          test "$red_rc" -ne 0
          grep -q '2 failed' proof/red.log
          ! grep -q 'Unhandled Errors' proof/red.log
          cp "$RUNNER_TEMP/reconcile-candidate.ts" "$file"
          trap - EXIT
          git diff --exit-code > proof/restored-source.txt
          npm --workspace @openrig/cli test -- test/reconcile-session.test.ts --reporter=verbose 2>&1 | tee proof/green.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-pane-message
          path: proof/
          if-no-files-found: error
