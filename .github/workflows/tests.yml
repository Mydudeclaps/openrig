name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  missing-pane-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 295c0b28b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Record exact source
        run: |
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
      - run: npm ci
      - id: build
        run: npm run build
      - name: Focused daemon repair and guard cases
        run: |
          set -o pipefail
          npm --workspace @openrig/daemon test -- test/reconcile-session.test.ts test/seat-delivery-guard-correction.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
      - name: Focused CLI compatibility cases
        if: ${{ !cancelled() && steps.build.outcome != 'failure' }}
        run: |
          set -o pipefail
          npm --workspace @openrig/cli test -- test/reconcile-session.test.ts --reporter=verbose 2>&1 | tee proof/cli.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: missing-pane-focused
          path: proof/
          if-no-files-found: error
