name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  notice-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 201efa76164f0058284c34a1f4874ba1fb77e8d2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: command -v tmux || (sudo apt-get update && sudo apt-get install -y tmux)
      - run: npm ci
      - run: npm run build
      - name: Claude hook interpreter regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/claude-hook-node-invocation.test.ts test/claude-core-plugin-load.test.ts test/codex-core-plugin-route.test.ts test/successor-session-launcher.test.ts test/claude-activity-hook-delivery.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: claude-hook-red
          path: proof/
          if-no-files-found: error
