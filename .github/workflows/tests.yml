name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  parked-attempts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 00d9d453e0bc04524d37c36d2f936ce1cb4b4895
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Current parked-owner input regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/watchdog-delivery-guarded.test.ts test/parked-owner-consumer.test.ts test/parked-owner-compaction.test.ts test/queue-wake-ladder.test.ts test/watchdog-policy-engine.test.ts test/qa-draft-caller-cancel.test.ts test/qa-send-caller-cancel.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s22-parked-attempts-green
          path: proof/
          if-no-files-found: error
