name: Tests
on: workflow_dispatch
permissions:
  contents: read
jobs:
  up-existing-stops:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6dd4b444cafeb5a932039bd774ace001d990cec0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Proved current stop regression
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p proof
          git rev-parse HEAD HEAD^{tree} > proof/source.txt
          node --version > proof/node-version.txt
          npm --workspace @openrig/daemon test -- test/stopped-seat-restore-contract.test.ts test/stopped-fresh-up.test.ts test/restore-plan-preview.test.ts test/restore-check-rehydrate-eligibility.test.ts test/restore-preconditions.test.ts test/kernel-lost-restore-coordination.test.ts test/yaml-import-replaces-stopped-generation.test.ts test/snapshot-capture.test.ts --reporter=verbose 2>&1 | tee proof/daemon.log
          result=${PIPESTATUS[0]}
          npm run lint 2>&1 | tee proof/typecheck.log
          lint_result=${PIPESTATUS[0]}
          git diff --exit-code > proof/source-unchanged.txt
          printf 'daemon=%s\ntypecheck=%s\n' "$result" "$lint_result" > proof/exits.txt
          test "$result" -eq 0 && test "$lint_result" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: up-existing-stops-r2-green
          path: proof/
          if-no-files-found: error
