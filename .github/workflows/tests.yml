name: Historical prompt-state author qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-prompt-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record exact historical product and test-only overlay
        run: |
          mkdir -p dist/pr-scenarios
          git diff --stat 32633a3d8f991797fec6952370fb5e6accd7e20d HEAD > dist/pr-scenarios/overlay-stat.txt
          git diff --exit-code 32633a3d8f991797fec6952370fb5e6accd7e20d HEAD -- packages/cli/src packages/daemon/src packages/tui/src packages/ui/src packages/sdk/src packages/core/src assets package.json package-lock.json scripts/build-package.sh
          git rev-parse 32633a3d8f991797fec6952370fb5e6accd7e20d 32633a3d8f991797fec6952370fb5e6accd7e20d^{tree} HEAD > dist/pr-scenarios/source-binding.txt
      - name: Require the named installed fail-before assertion
        shell: bash
        run: |
          status=0
          bash scripts/run-pr-scenarios.sh --case prompt-state --mode healthy > dist/pr-scenarios/author-command.log 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PYCODE'
          import json,pathlib
          p=pathlib.Path('dist/pr-scenarios/1-prompt-state-healthy.log')
          reports=[json.loads(x.split('=',1)[1]) for x in p.read_text().splitlines() if x.startswith('OPENRIG_SCENARIO_RESULT=')]
          assert len(reports)==1, 'missing unique installed report'
          r=reports[0]
          assert '#1946 pane-only needs_input/ATTN' in r.get('error',''), r.get('error')
          assert r['promptState']['stage']=='pane-only-attention'
          assert r['promptState']['runtimes']==['codex','claude-code']
          pathlib.Path('dist/pr-scenarios/EXPECTED-FAILURE.json').write_text(json.dumps({'source': '32633a3d8f991797fec6952370fb5e6accd7e20d', 'assertion': '#1946 pane-only needs_input/ATTN', 'stage': 'pane-only-attention', 'qualified': True}, indent=2)+'\n')
          PYCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-prompt-state-evidence
          path: dist/pr-scenarios/
          if-no-files-found: error
